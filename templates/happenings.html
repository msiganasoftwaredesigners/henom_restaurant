{% extends 'base.html'%}
{% load static %}
{% block title %}Happenings{% endblock %}
{% block content %}
<div class="relative w-full h-80 md:h-[500px] flex items-center justify-center bg-cover bg-center" style="background-image: url('{% static 'images/happenings/happening.jpg' %}');">
  <h1 class="text-4xl md:text-5xl font-bold text-white melaku">EVENTS AT HENOM</h1>
</div>
<div class="bg-slate-100">
<div class=" mx-auto 2xl:mx-48 px-4 py-8 text-center bg-slate-100">
  <h2 class="text-sm md:text-xl font-semibold mb-6 melaku">Find out what's happening at the Henom Restaurant</h2>
  
  <div class="grid grid-cols-1 md:grid-cols-2 2xl:gap-6 md:space-x-6 md:mx-32 2xl:mx-64">
    <!-- Card 1 -->
   <!-- Add the custom CSS to your stylesheet -->
<style>
    @layer utilities {
        .custom-inclined {
          clip-path: polygon(10% 0, 90% 0, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0 90%, 0 10%);
          border-radius: 0.75rem; /* This is equivalent to rounded-xl in Tailwind */
        }
      }
      
  </style>
  
  <div class="relative group bg-slate-100 overflow-hidden card mt-4">
    <img src="{% static 'images/happenings/happ3.jpg' %}" alt="Event 1" class="w-full h-80 object-cover custom-inclined transform transition-transform duration-300 group-hover:scale-110">
    <div class="p-4">
      <h3 class="text-lg font-semibold me">Valentine's Day Special,February 14</h3>
    </div>
  </div>
  
      
      
      
      
      
    
    <!-- Card 2 -->
    <div class="relative group bg-slate-100 overflow-hidden card mt-4">
      <img src="{% static 'images/happenings/ha11.jpg' %}" alt="Event 2" class="w-full h-80 object-cover custom-inclined transform transition-transform duration-300 group-hover:scale-110">
      <div class="p-4">
        <h3 class="text-lg md:text-xl font-semibold me"> New Year's Eve Party</h3>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="relative group bg-slate-100 overflow-hidden card mt-4">
      <img src="{% static 'images/happenings/happ6.jpg' %}" alt="Event 3" class="w-full h-80 object-cover custom-inclined transform transition-transform duration-300 group-hover:scale-110">
      <div class="p-4 ">
        <h3 class="text-lg font-semibold me">Monthly Wine Tasting</h3>
      </div>
    </div>
    
    <!-- Card 4 -->
    <div class="relative group bg-slate-100  overflow-hidden card mt-4">
      <img src="{% static 'images/happenings/happ4.jpg' %}" alt="Event 4" class="w-full h-80 object-cover custom-inclined transform transition-transform duration-300 group-hover:scale-110">
      <div class="p-4">
        <h3 class="text-lg font-semibold me">Dinner with Jazz</h3>
      </div>
    </div>
  </div>
</div>
</div>
{% endblock %}
