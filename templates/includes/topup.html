{% load static %}
{% block content %}

<!-- Contact Button -->
<button id="contactButton" class="fixed bottom-8 right-4 z-50 p-3 mb-6 px-4 rounded-full bg-green-500 text-white font-extrabold transition-colors duration-300 hover:bg-blue-500 hover:text-yellow-300 md:bottom-16 md:right-6 md:px-5 md:p-4">
  <i class="fa-solid fa-comment-sms text-xl"></i>
</button>

<!-- Contact Cards -->
<div id="contactCards" class="fixed bottom-20 right-8 z-40 transition-opacity transform opacity-0 translate-y-2 md:bottom-24 md:right-4 md:translate-y-0">
    <div class="bg-white p-4 border border-gray-300 rounded-lg mb-2 flex items-center">
        <i class="fa-solid fa-comment-sms text-2xl text-green-500"></i>
        <a href="sms:+25196 622 3344" class="ml-2 text-gray-700">SMS</a>
    </div>
    <div class="bg-white p-4 border border-gray-300 rounded-lg mb-2 flex items-center">
        <i class="fab fa-telegram text-3xl text-blue-400"></i>
        <a href="https://t.me/username" class="ml-2  text-gray-700">Telegram</a>
    </div>
    <div class="bg-white p-4 border border-gray-300 rounded-lg flex items-center">
        <i class="fa-solid fa-phone text-2xl text-blue-500"></i>
        <a href="tel:+25196 622 3344" class="ml-2 text-gray-700">Call</a>
    </div>
</div>

<script>
    $(document).ready(function() {
        $('#contactButton').on('click', function() {
            $('#contactCards').toggleClass('opacity-0 translate-y-2 opacity-100 translate-y-0');
            if ($('#contactCards').hasClass('opacity-100')) {
                $('#contactButton').hide();
            } else {
                $('#contactButton').show();
            }
        });

        $(document).on('click', function(event) {
            if (!$(event.target).closest('#contactButton, #contactCards').length) {
                $('#contactCards').removeClass('opacity-100 translate-y-0').addClass('opacity-0 translate-y-2');
                $('#contactButton').show();
            }
        });
    });
</script>

{% endblock %}
