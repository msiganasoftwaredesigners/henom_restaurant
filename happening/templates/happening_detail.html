{% extends 'base.html'%}
{% load static %}
{% block title %}{{ event.title }}{% endblock title %}
{% block content %}
<div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-sm overflow-hidden m-4">
    <h1 class="text-3xl text-center text-blue-950 font-bold mb-4">{{ event.title }}</h1>
    <div class="w-full h-64 md:h-[480px] overflow-hidden rounded-md">
        <img class="w-full h-full object-cover" src="{{ event.image.url }}" alt="{{ event.title }}">
    </div>
    <div class="mt-8 text-black">
        {{ event.description.html|safe }}
    </div>
</div>
<div class="max-w-4xl mx-auto px-4 sm:px-0 m-4">
    <a href="{% url 'happenings' %}" class="inline-block bg-blue-950 text-white px-4 py-2 rounded hover:bg-blue-900 transition-colors duration-200">
        <i class="fas fa-arrow-left"></i> Back to  Events
    </a>
</div>
{% endblock content %}
