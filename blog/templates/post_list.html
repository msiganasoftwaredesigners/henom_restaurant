{% extends 'base.html' %}
{% load static %}

{% block title %}Henom Blog{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 sm:px-0 mt-8 md:mt-16">
    <h1 class="text-3xl font-bold text-center mb-6">Blog Articles</h1>
</div>

<div class="container pt-4 pb-6 items-center px-4 sm:px-8 md:px-16 lg:px-32 xl:px-32 2xl:max-w-9xl 2xl:mx-auto">
    <div id="blog-gallery" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 px-4 sm:px-0 md:m-4">
        <!-- Blog posts will be inserted here by blog.js -->
    </div>

    <div class="max-w-6xl mx-auto px-4 sm:px-0 m-4">
        <a href="{% url 'home' %}" class="inline-block bg-blue-950 text-white px-4 py-2 rounded hover:bg-blue-700 transition-colors duration-200">
            <i class="fas fa-arrow-left"></i> Back to shop
        </a>
    </div>
</div>

<!-- Link the blog.js script -->
<script src="{% static 'js/blog.js' %}" defer></script>
{% endblock %}
